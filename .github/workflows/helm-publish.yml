name: Helm Publish

on:
  push:
    tags:
      - "chart-v*.*.*"
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  CHART_PATH: charts/dagster-prometheus-exporter
  OCI_REPO: oci://ghcr.io/hirofumitsuda/charts

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs helm at the version in .tool-versions, so CI and local
      # development run the same one. azure/setup-helm defaults to "latest",
      # which is not reproducible and drifted a major version away from the
      # helm used for local chart testing.
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4

      - name: Verify tag matches Chart.yaml version
        if: github.event_name == 'push'
        run: |
          tag_version="${GITHUB_REF_NAME#chart-v}"
          chart_version="$(helm show chart "$CHART_PATH" | awk '/^version:/ {print $2}')"
          if [ "$tag_version" != "$chart_version" ]; then
            echo "Tag chart-v$tag_version does not match Chart.yaml version $chart_version" >&2
            exit 1
          fi

      - run: helm lint --strict "$CHART_PATH"

      - name: Package chart
        run: helm package "$CHART_PATH" --destination .

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push chart to GHCR (OCI)
        run: |
          chart_package="$(ls dagster-prometheus-exporter-*.tgz)"
          helm push "$chart_package" "$OCI_REPO"

      - uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3

      - name: Push Artifact Hub repository metadata
        run: |
          oras push \
            "${REGISTRY}/hirofumitsuda/charts/dagster-prometheus-exporter:artifacthub.io" \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "$CHART_PATH/artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"
