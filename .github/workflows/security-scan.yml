name: Security Scan

on:
  pull_request:
    branches: [main]
    paths:
      - "charts/**"
      - "uv.lock"
      - "pyproject.toml"
      - ".github/workflows/security-scan.yml"
  schedule:
    # Vulnerabilities are found in images and packages that were clean when
    # they shipped, so the published image and the lock file are rescanned.
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  TRIVY_VERSION: v0.76.1

jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: charts/dagster-prometheus-exporter
          severity: HIGH,CRITICAL
          exit-code: "1"
          version: ${{ env.TRIVY_VERSION }}

  python-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # uv.lock only feeds the dev tooling, so none of it is in the image. The
      # dev groups are the whole point of this scan: without
      # TRIVY_INCLUDE_DEV_DEPS Trivy skips them and reports nothing.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_INCLUDE_DEV_DEPS: "true"
        with:
          scan-type: fs
          scan-ref: uv.lock
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          version: ${{ env.TRIVY_VERSION }}

  published-image:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/hirofumitsuda/dagster-prometheus-exporter:latest
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          version: ${{ env.TRIVY_VERSION }}
