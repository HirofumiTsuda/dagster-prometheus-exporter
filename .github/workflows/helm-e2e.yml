name: Helm e2e (kind)

# Complements helm-lint.yml: that catches template syntax errors, this
# actually installs the chart into a real cluster against a real Dagster
# instance and asserts the exporter gets real data — see issue #44.
#
# Deliberately not a pull_request/push trigger: this also exercises the Go
# server itself (the exporter image is always built fresh from the current
# checkout, so any internal/**/cmd/** regression would show up here too),
# not just chart/docker/dev changes — but a full kind cluster spin-up per
# PR is heavy, and (being a real end-to-end test against real
# infrastructure) more prone to transient flakiness than the unit-test-level
# checks in ci.yml, so it isn't a required status check either. Scheduled +
# on-demand instead: catches real regressions over time without slowing
# down or blocking every PR.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: helm/kind-action@v1
        with:
          cluster_name: dagster-exporter-e2e

      # Installs helm at the version in .tool-versions, so CI and local
      # development run the same one. azure/setup-helm defaults to "latest",
      # which is not reproducible and drifted a major version away from the
      # helm used for local chart testing.
      - uses: jdx/mise-action@v4

      # For "Determine expected metric families" below — TestListMetricNames
      # runs on the runner directly, not inside a container.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # See internal/server/metric_names_test.go and issue #90: this is the
      # single source of truth for "which metric families should exist",
      # so the assertion below checks all of them instead of the one
      # (dagster_active_runs) it used to. #85 — two whole tick-status
      # families that had never emitted a single series — would have been
      # invisible to this job before this change, exactly like it was
      # invisible to the unit tests mocking GraphQL.
      - name: Determine expected metric families
        run: |
          go test -run TestListMetricNames -v ./internal/server/... \
            | grep '^METRIC:' | sed 's/^METRIC: //' | sort > /tmp/expected-metrics.txt
          echo "--- expected metric families ($(wc -l < /tmp/expected-metrics.txt)) ---"
          cat /tmp/expected-metrics.txt

          # dagster_run_queue_concurrency_key_backlog and
          # dagster_asset_last_materialization_status used to be excluded
          # here (needed a run-queue backlog / a materialized asset that
          # nothing created) — the "Trigger asset materialization and
          # run-queue backlog conditions" step now creates both conditions.
          #
          # dagster_exporter_scrape_errors_total only appears once a scrape
          # has failed, which a healthy e2e run never does — it can't be
          # asserted present here even in principle, so it stays excluded.
          cat > /tmp/not-yet-asserted.txt <<'NAMES'
          dagster_exporter_scrape_errors_total
          NAMES
          grep -vFxf /tmp/not-yet-asserted.txt /tmp/expected-metrics.txt > /tmp/expected-metrics-asserted.txt
          echo "--- asserted this run ($(wc -l < /tmp/expected-metrics-asserted.txt) of $(wc -l < /tmp/expected-metrics.txt)) ---"
          cat /tmp/expected-metrics-asserted.txt

      - name: Build exporter and Dagster dev images
        run: |
          docker build -f docker/exporter.Dockerfile -t dagster-prometheus-exporter-e2e:exporter .
          docker build -f docker/dagster-dev.Dockerfile -t dagster-prometheus-exporter-e2e:dagster .

      - name: Load images into kind
        run: |
          kind load docker-image dagster-prometheus-exporter-e2e:exporter dagster-prometheus-exporter-e2e:dagster \
            --name dagster-exporter-e2e

      - name: Deploy the Dagster test fixture
        run: |
          kubectl apply -f dev/kubernetes/dagster-deployment.yaml
          kubectl rollout status deployment/dagster --timeout=120s

      # dagster_asset_last_materialization_status and
      # dagster_run_queue_concurrency_key_backlog don't appear from just
      # standing the fixtures up — see the two "needs" comments removed
      # from the not-yet-asserted list below. Triggered here (against
      # Dagster's own GraphQL, not the exporter) so the scrape+poll loop in
      # the next-next step has the ~100s it already budgets to pick both up,
      # rather than racing a trigger fired right before that poll starts.
      - name: Trigger asset materialization and run-queue backlog conditions
        run: |
          kubectl port-forward svc/dagster 3000:3000 &
          DAGSTER_PORT_FORWARD_PID=$!
          for i in $(seq 1 10); do
            curl -sf http://localhost:3000/server_info > /dev/null && break
            sleep 1
          done

          # One launch per asset, not both in a single run: this metric is
          # derived from the *run's* status (assetsLatestInfo.latestRun),
          # not the individual asset's step (see docs/metrics.md) --
          # materializing them together would make good_asset inherit
          # bad_asset's failure, since one failing step fails the whole run.
          # Verified locally: that's exactly what happened before this was
          # split into two launches.
          echo "--- materializing good_asset (dagster_asset_last_materialization_status needs a run, not just Definitions loading) ---"
          curl -sf -X POST http://localhost:3000/graphql -H 'Content-Type: application/json' -d '{
            "query": "mutation($e: ExecutionParams!) { launchPipelineExecution(executionParams: $e) { __typename ... on LaunchRunSuccess { run { runId status } } ... on PythonError { message } } }",
            "variables": {"e": {"selector": {"repositoryLocationName": "dev-dagster-workspace", "repositoryName": "__repository__", "jobName": "__ASSET_JOB", "assetSelection": [{"path": ["good_asset"]}]}, "mode": "default"}}
          }'
          echo

          echo "--- materializing bad_asset ---"
          curl -sf -X POST http://localhost:3000/graphql -H 'Content-Type: application/json' -d '{
            "query": "mutation($e: ExecutionParams!) { launchPipelineExecution(executionParams: $e) { __typename ... on LaunchRunSuccess { run { runId status } } ... on PythonError { message } } }",
            "variables": {"e": {"selector": {"repositoryLocationName": "dev-dagster-workspace", "repositoryName": "__repository__", "jobName": "__ASSET_JOB", "assetSelection": [{"path": ["bad_asset"]}]}, "mode": "default"}}
          }'
          echo

          echo "--- launching 3x heavy_job (concurrency_key=heavy_limit, limit 1 in dev/dagster_home/dagster.yaml -- 2 will queue) ---"
          for i in 1 2 3; do
            curl -sf -X POST http://localhost:3000/graphql -H 'Content-Type: application/json' -d '{
              "query": "mutation($e: ExecutionParams!) { launchPipelineExecution(executionParams: $e) { __typename ... on LaunchRunSuccess { run { runId status } } ... on PythonError { message } } }",
              "variables": {"e": {"selector": {"repositoryLocationName": "dev-dagster-workspace", "repositoryName": "__repository__", "jobName": "heavy_job"}, "mode": "default"}}
            }'
            echo
          done

          kill "$DAGSTER_PORT_FORWARD_PID"

      - name: Install the exporter chart
        run: |
          helm install exporter-e2e charts/dagster-prometheus-exporter \
            -f dev/kubernetes/exporter-e2e-values.yaml \
            --wait --timeout=120s

      - name: Assert /readyz and every metric family reports real data
        run: |
          kubectl port-forward svc/exporter-e2e-dagster-prometheus-exporter 9101:9101 &
          PORT_FORWARD_PID=$!
          # Give the port-forward a moment to establish before curling.
          for i in $(seq 1 10); do
            curl -sf http://localhost:9101/healthz > /dev/null && break
            sleep 1
          done

          echo "--- /readyz ---"
          READYZ=$(curl -sf http://localhost:9101/readyz)
          echo "$READYZ"
          echo "$READYZ" | grep -q '"status":"OK"' || { echo "::error::exporter is not ready against the real Dagster instance"; exit 1; }

          echo "--- /metrics (waiting for every asserted family in expected-metrics-asserted.txt) ---"
          # /readyz being OK only proves live Dagster connectivity, not that
          # a background scrape has completed yet — the HTTP server and the
          # scraper goroutine start concurrently (see internal/server.go),
          # and the readinessProbe is /healthz (unconditionally 200), so the
          # pod can be Ready before the first scrape lands. Most families
          # are zero-filled from the very first scrape (a scrape interval
          # of 15s), but the tick-status/timestamp families and
          # dagster_last_run_info/_duration_seconds need the dev fixture's
          # schedule (cron "* * * * *") or sensors (30s interval) to have
          # actually ticked at least once — up to ~60s in the worst case.
          # Poll for up to ~100s total rather than asserting on one sample.
          MISSING=""
          for i in $(seq 1 50); do
            METRICS=$(curl -sf http://localhost:9101/metrics)
            MISSING=""
            while read -r name; do
              echo "$METRICS" | grep -q "^${name}{" || MISSING="$MISSING $name"
            done < /tmp/expected-metrics-asserted.txt
            [ -z "$MISSING" ] && break
            sleep 2
          done

          if [ -n "$MISSING" ]; then
            echo "::error::the following metric families never appeared on /metrics after waiting: ${MISSING# }"
            exit 1
          fi
          echo "all $(wc -l < /tmp/expected-metrics-asserted.txt) asserted metric families are present"

          kill "$PORT_FORWARD_PID"

      - name: Dump pod state for debugging
        if: failure()
        run: |
          kubectl get pods -o wide
          echo "--- dagster ---"
          kubectl describe deployment/dagster
          kubectl logs deployment/dagster --tail=200
          echo "--- exporter ---"
          kubectl describe deployment/exporter-e2e-dagster-prometheus-exporter
          kubectl logs deployment/exporter-e2e-dagster-prometheus-exporter --tail=200
