name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Nothing here writes to the repository. A job that needs more asks for it.
permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    # paths-filter lists a pull request's files through the API.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ steps.filter.outputs.go }}
      python: ${{ steps.filter.outputs.python }}
      grafana: ${{ steps.filter.outputs.grafana }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            go:
              - "**.go"
              - go.mod
              - go.sum
              # golangci-lint's version and its enabled linters live in
              # these two, so a change to either has to re-run the lint job.
              - .tool-versions
              - .golangci.yml
              - .github/workflows/ci.yml
            python:
              - "**.py"
              - pyproject.toml
              - .github/workflows/ci.yml
            grafana:
              - "dev/grafana/dashboards/**.json"
              - .github/workflows/ci.yml

  test:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Keeps go.mod's direct/indirect split honest. Nothing else in CI
      # reads it, so without this it drifts silently as dependencies come
      # and go.
      - name: Check go.mod and go.sum are tidy
        run: |
          go mod tidy
          if ! git diff --exit-code go.mod go.sum; then
            echo "::error::go.mod/go.sum are not tidy. Run 'go mod tidy' and commit the result."
            exit 1
          fi

      - run: go build ./...

      - run: go vet ./...

      - run: go test -race -coverprofile=coverage.txt ./...

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  lint:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # version-file reads .tool-versions, the same file mise reads locally,
      # so there's one place to bump golangci-lint rather than a CI pin that
      # local installs drift away from. It requires the default binary
      # install-mode (goinstall doesn't support it), which is what
      # golangci-lint recommends anyway — official release binaries instead
      # of a build against whatever Go version happens to be present.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version-file: .tool-versions

  python-lint:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - run: uvx ruff@0.16.2 check .

  grafana-lint:
    needs: changes
    if: needs.changes.outputs.grafana == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check dashboard JSON is valid and jq-formatted
        run: |
          for f in dev/grafana/dashboards/*.json; do
            jq empty "$f"
            diff <(jq . "$f") "$f"
          done
