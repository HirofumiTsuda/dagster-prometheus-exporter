apiVersion: v2
name: dagster-prometheus-exporter
description: A Prometheus exporter for Dagster run metrics
type: application
version: 0.1.15
# Must exactly match a real tag on ghcr.io/hirofumitsuda/dagster-prometheus-exporter
# (no "v" prefix — docker/metadata-action's {{version}} pattern in
# docker-publish.yml strips it from the git tag when publishing), since
# templates/deployment.yaml defaults image.tag to this value.
appVersion: "0.10.0"
home: https://github.com/HirofumiTsuda/dagster-prometheus-exporter
sources:
  - https://github.com/HirofumiTsuda/dagster-prometheus-exporter
maintainers:
  - name: HirofumiTsuda
    url: https://github.com/HirofumiTsuda
keywords:
  - dagster
  - dagster-plus
  - dagster-cloud
  - prometheus
  - monitoring
  - observability
  - grafana
annotations:
  artifacthub.io/category: monitoring-logging
  artifacthub.io/license: MIT
  artifacthub.io/links: |
    - name: GitHub
      url: https://github.com/HirofumiTsuda/dagster-prometheus-exporter
    - name: Issues
      url: https://github.com/HirofumiTsuda/dagster-prometheus-exporter/issues
  artifacthub.io/prerelease: "false"
  artifacthub.io/screenshots: |
    - title: Dagster run metrics dashboard in Grafana
      url: https://raw.githubusercontent.com/HirofumiTsuda/dagster-prometheus-exporter/main/docs/images/grafana-dashboard.png
  artifacthub.io/changes: |
    - kind: changed
      description: "jobLastRunFailed no longer fires forever for a job nobody runs any more: it keeps firing until the job succeeds only while a schedule or sensor still launches it (dagster_job_automation_running == 1), and for 24 hours after the failure otherwise. A failed job that no schedule or sensor launches now stops alerting 24 hours after its failure. Needs exporter 0.10.0 or newer, the chart's default image."
    - kind: added
      description: "jobNoRecentSuccess (DagsterJobNoRecentSuccess): an automated job that has not finished a successful run in 26 hours. Ships disabled, since jobs run at different cadences; set the threshold in alerts.rules.jobNoRecentSuccess.expr before enabling it."
