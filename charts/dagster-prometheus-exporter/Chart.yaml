apiVersion: v2
name: dagster-prometheus-exporter
description: A Prometheus exporter for Dagster run metrics
type: application
version: 0.1.13
# Must exactly match a real tag on ghcr.io/hirofumitsuda/dagster-prometheus-exporter
# (no "v" prefix — docker/metadata-action's {{version}} pattern in
# docker-publish.yml strips it from the git tag when publishing), since
# templates/deployment.yaml defaults image.tag to this value.
appVersion: "0.9.0"
home: https://github.com/HirofumiTsuda/dagster-prometheus-exporter
sources:
  - https://github.com/HirofumiTsuda/dagster-prometheus-exporter
maintainers:
  - name: HirofumiTsuda
    url: https://github.com/HirofumiTsuda
keywords:
  - dagster
  - dagster-plus
  - dagster-cloud
  - prometheus
  - monitoring
  - observability
  - grafana
annotations:
  artifacthub.io/category: monitoring-logging
  artifacthub.io/license: MIT
  artifacthub.io/links: |
    - name: GitHub
      url: https://github.com/HirofumiTsuda/dagster-prometheus-exporter
    - name: Issues
      url: https://github.com/HirofumiTsuda/dagster-prometheus-exporter/issues
  artifacthub.io/prerelease: "false"
  artifacthub.io/screenshots: |
    - title: Dagster run metrics dashboard in Grafana
      url: https://raw.githubusercontent.com/HirofumiTsuda/dagster-prometheus-exporter/main/docs/images/grafana-dashboard.png
  artifacthub.io/changes: |
    - kind: added
      description: "dagsterGraphqlCA: name a Secret or a ConfigMap that holds a PEM file, and the chart mounts that key read-only and sets DAGSTER_GRAPHQL_CA_FILE to it, for a GraphQL endpoint served under a private CA (existingSecret or existingConfigMap, not both; key defaults to ca.crt). Nothing changes unless you set it. Restart the pod after rotating the CA."
    - kind: changed
      description: "appVersion 0.8.0 to 0.9.0: adds JOB_TAG_LABELS, which exports job tags as labels on a new dagster_job_tags metric (set it with env.JOB_TAG_LABELS=owner), and DAGSTER_GRAPHQL_CA_FILE. Nothing changes unless you set them. See the v0.9.0 release notes."
