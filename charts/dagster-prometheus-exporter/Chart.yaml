apiVersion: v2
name: dagster-prometheus-exporter
description: A Prometheus exporter for Dagster run metrics
type: application
version: 0.1.8
# Must exactly match a real tag on ghcr.io/hirofumitsuda/dagster-prometheus-exporter
# (no "v" prefix — docker/metadata-action's {{version}} pattern in
# docker-publish.yml strips it from the git tag when publishing), since
# templates/deployment.yaml defaults image.tag to this value.
appVersion: "0.5.0"
home: https://github.com/HirofumiTsuda/dagster-prometheus-exporter
sources:
  - https://github.com/HirofumiTsuda/dagster-prometheus-exporter
maintainers:
  - name: HirofumiTsuda
    url: https://github.com/HirofumiTsuda
keywords:
  - dagster
  - prometheus
  - monitoring
  - observability
  - grafana
annotations:
  artifacthub.io/category: monitoring-logging
  artifacthub.io/license: MIT
  artifacthub.io/links: |
    - name: GitHub
      url: https://github.com/HirofumiTsuda/dagster-prometheus-exporter
    - name: Issues
      url: https://github.com/HirofumiTsuda/dagster-prometheus-exporter/issues
  artifacthub.io/prerelease: "false"
  artifacthub.io/screenshots: |
    - title: Dagster run metrics dashboard in Grafana
      url: https://raw.githubusercontent.com/HirofumiTsuda/dagster-prometheus-exporter/main/docs/images/grafana-dashboard.png
  artifacthub.io/changes: |
    - kind: added
      description: "Optional PrometheusRule alerts (13 rules covering daemon heartbeat, run/schedule/sensor health, asset staleness, and exporter self-health), disabled by default via alerts.enabled (#112, #113 -- thanks @Pionerd for the proposal and reference rules). First chart release to include this."
    - kind: added
      description: "ArtifactHub listing metadata (screenshot, changelog annotations)."
    - kind: fixed
      description: "Fixed the previous release's changelog entry getting silently truncated at \"#112,\" -- an unquoted YAML scalar treats a space followed by # as a comment, cutting everything after it. Quoting the description avoids this."
