replicaCount: 1

nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/hirofumitsuda/dagster-prometheus-exporter
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent

# Port the exporter listens on. Used for the container port, the Service
# port, and the PORT env var — keep it a single value so those three can't
# drift out of sync.
port: 9101

service:
  type: ClusterIP

# Passed to the exporter as environment variables via a ConfigMap. Keys
# match internal/config/config.go exactly (see the README's Configuration
# table). DAGSTER_GRAPHQL_ENDPOINT has no sane default for a real
# deployment — it must be set here.
#
# If Dagster itself was installed via the official chart
# (https://github.com/dagster-io/dagster/tree/master/helm/dagster), its
# webserver Service is named "<release-name>-webserver" and listens on
# port 80 by default — e.g. for `helm install dagster dagster/dagster -n
# dagster`, that's http://dagster-webserver.dagster.svc.cluster.local/graphql.
env: {}
  # DAGSTER_GRAPHQL_ENDPOINT: "http://dagster-webserver.dagster.svc.cluster.local/graphql"
  # LOOKBACK_WINDOW_MINUTES: "15"
  # CACHE_TTL_MINUTES: "300"
  # DAGSTER_SCRAPING_INTERVAL_SECONDS: "15"
  # DAGSTER_SCRAPING_TIMEOUT_SECONDS: "10"
  # RUNS_PAGE_SIZE: "500"
  # RUNS_UPDATED_AFTER_SAFETY_MARGIN_MINUTES: "5"

resources: {}

podAnnotations: {}
podLabels: {}

# For prometheus-operator setups. Requires the ServiceMonitor CRD to already
# be installed in the cluster.
serviceMonitor:
  enabled: false
  interval: 30s
  additionalLabels: {}

# For prometheus-operator setups. Requires the PrometheusRule CRD to already
# be installed in the cluster (same prerequisite as serviceMonitor above).
# Off by default so installing the chart never surfaces alerts nobody asked
# for. The rules themselves are the best-practice set from
# https://github.com/HirofumiTsuda/dagster-prometheus-exporter/issues/112;
# thresholds mirror what docs/metrics.md already recommends per metric.
#
# Each rule can be turned off individually (`enabled: false`) without
# disabling the others, so e.g. a noisy alert can be dropped while keeping
# the rest -- see https://github.com/HirofumiTsuda/dagster-prometheus-exporter/issues/112.
#
# The alert annotations (see templates/prometheusrule.yaml) describe these
# defaults in plain English (e.g. "over 2 minutes"). Overriding a threshold,
# `for`, or `severity` below changes alerting behavior but not that wording
# -- keep them in sync by hand if you override one.
alerts:
  enabled: false
  additionalLabels: {}
  rules:
    # dagster_daemon_healthy can stay 1 for up to 30 minutes after a daemon
    # actually died (Dagster's own heartbeat tolerance) -- alerting on
    # heartbeat staleness instead catches it far sooner.
    daemonHeartbeatStale:
      enabled: true
      thresholdSeconds: 120
      for: 2m
      severity: critical
    jobLastRunFailed:
      enabled: true
      for: 5m
      severity: warning
    runStuckInQueue:
      enabled: true
      thresholdSeconds: 600
      for: 5m
      severity: warning
    scheduleNotSucceeding:
      enabled: true
      for: 15m
      severity: warning
    sensorTickFailing:
      enabled: true
      for: 15m
      severity: warning
    sensorTickStale:
      enabled: true
      thresholdSeconds: 300
      for: 5m
      severity: warning
    codeLocationLoadError:
      enabled: true
      for: 10m
      severity: warning
    exporterScrapeFailing:
      enabled: true
      for: 10m
      severity: warning
  # Extra PrometheusRule rules to append verbatim (alert/expr/for/labels/
  # annotations), for alerts this chart can't know about in advance -- e.g.
  # ones specific to your own jobs or schedules.
  additionalRules: []
