version: 2

seeds:
  - name: raw_customers
    description: Raw customer records, loaded as-is from the seed CSV.
    columns:
      - name: id
        description: Unique identifier for a customer.
        data_tests:
          - unique
          - not_null
      - name: first_name
        data_tests:
          - not_null
      - name: last_name
        data_tests:
          - not_null
